{# Pagina di accesso #}
{% from '_macros.html' import csrf %}
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#232b33">
  <title>Accedi · Officina</title>
  <script>
    (function () { var t = null; try { t = localStorage.getItem('tema'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', t); })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <div class="login-sfondo">
    <div class="login-box">
      <div class="testa">
        <h1 class="h3 mb-1"><i class="bi bi-wrench-adjustable"></i> Officina</h1>
        <p class="tenue mb-3">Tagliandi, scadenze e storico dei tuoi veicoli.</p>
        {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
      </div>
      <form method="post">
        {{ csrf() }}
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input id="username" name="username" class="form-control form-control-lg" required autocomplete="username" autocapitalize="none" autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control form-control-lg" required autocomplete="current-password">
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="ricordami" id="ricordami" checked>
          <label class="form-check-label" for="ricordami">Resta collegato su questo dispositivo</label>
        </div>
        <button class="btn btn-primary btn-lg w-100">Accedi</button>
      </form>
    </div>
  </div>
</body>
</html>
