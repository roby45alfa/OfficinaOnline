# OfficinaOnline – avvio: docker compose up -d --build
services:
  officina:
    build: .
    container_name: officina
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - TZ=Europe/Rome
    volumes:
      # Codice, database.db e foto/libretti in static/ restano sulla cartella del progetto
      - .:/app
    labels:
      - "homepage.group=Automazione"
      - "homepage.name=Officina"
      - "homepage.icon=tools"
      - "homepage.href=http://192.168.1.199:5000/gestioneveicoli/"
      - "homepage.description=Tagliandi e scadenze veicoli"
